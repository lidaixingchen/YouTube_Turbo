name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 验证 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: 配置 pnpm
        uses: pnpm/action-setup@v6
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile
      - name: 严格类型检查
        run: pnpm check
      - name: 全量测试
        run: pnpm test --maxWorkers=1 --pool=threads
      - name: 生产构建
        run: pnpm build
      - name: 保存用户脚本
        uses: actions/upload-artifact@v7
        with:
          name: userscript-${{ matrix.os }}
          path: dist/youtube-turbo.user.js
          if-no-files-found: error
